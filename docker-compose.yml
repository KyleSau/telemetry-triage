# Local single-node Kafka in KRaft mode (no ZooKeeper), plus the API wired to it.
#
#   docker compose up -d kafka        # broker only: CLI "--bus kafka" runs and the Kafka integration tests
#   docker compose up --build         # broker + API; the API consumes telemetry.synth-01 continuously
#   dotnet run --project src/TelemetryTriage.Cli -- publish --scenario correlated-fault   # feed it
#
# Demo settings only: one broker, replication factor 1, plaintext listeners.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Bus__Kind: kafka
      Kafka__BootstrapServers: kafka:29092
      Kafka__StreamName: SYNTH-01
      Pipeline__Scenario: ""        # empty = consume continuously instead of replaying a scenario
      Observability__Exporter: console
